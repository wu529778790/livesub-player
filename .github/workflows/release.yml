name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    # 产品决策：Release 只出 macOS（Apple Silicon）产物。Windows/Linux 播放内核
    # 接入前，装上也放不了视频——上架空壳安装包只会换来差评，所以 release 流水线
    # 不再构建它们；编译验证仍在 build.yml 三平台矩阵里做。
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      CMAKE_OSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装 macOS 依赖（libmpv）
        run: brew install mpv

      - name: 安装前端依赖
        run: npm install

      # Release 用 release 构建（关闭调试信息，体积小性能好）
      - name: 构建 release
        run: npm run tauri -- build --bundles app

      - name: 内嵌 libmpv 运行时（macOS 开箱即用）
        run: |
          brew install dylibbundler
          APP="src-tauri/target/release/bundle/macos/LiveSub-Player.app"
          # 递归收集主程序依赖的动态库（libmpv 及其 Homebrew 依赖树）拷进 .app 并重写路径
          dylibbundler -cd -b -x "$APP/Contents/MacOS/livesub-player" -d "$APP/Contents/libs"
          # dylibbundler 会给内嵌库写重复的 LC_RPATH，dyld 拒绝加载——全部删掉
          # （依赖路径已是 @executable_path/../libs/ 直达，rpath 无必要）
          for f in "$APP/Contents/libs/"*; do
            n=$(otool -l "$f" | grep -c "path @executable_path/../libs/" || true)
            for i in $(seq 1 "$n"); do install_name_tool -delete_rpath "@executable_path/../libs/" "$f" 2>/dev/null || true; done
            codesign --force -s - "$f"
          done
          # ad-hoc 重签保持包有效
          codesign --force --deep -s - "$APP"

      - name: 打包 macOS .app 为 zip
        run: |
          cd src-tauri/target/release/bundle/macos
          zip -qry "$GITHUB_WORKSPACE/LiveSub-Player-macOS.zip" LiveSub-Player.app

      # 标准 macOS 安装方式：拖入 Applications 的引导窗口（标题/箭头/公证提示烘焙在背景图里）。
      # 不能用 tauri bundler 的 dmg——它在 dylibbundler 内嵌 libmpv 之前打包，会缺运行时；
      # 必须在内嵌+重签之后用 create-dmg 手工制作（背景图与图标坐标见 packaging/dmg/）。
      # CI 的 macOS runner 支持 Finder AppleScript（create-dmg 内部用），失败会自动重试。
      - name: 安装 create-dmg
        run: brew install create-dmg

      - name: 制作 macOS 安装 DMG（拖入 Applications 引导窗口）
        run: |
          mkdir -p dmg-stage
          cp -R src-tauri/target/release/bundle/macos/LiveSub-Player.app dmg-stage/
          bash packaging/dmg/make-dmg.sh dmg-stage LiveSub-Player.dmg
          rm -rf dmg-stage

      # 自动更新包：必须在内嵌 libmpv + 重签之后再打 tar（bundler 自带产物是内嵌前的），
      # 手工 minisign 签名（createUpdaterArtifacts 保持 false，本地构建无需密钥）
      - name: 打自动更新包并签名（macOS）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 私钥已加密：密码单列为第二个 secret（2026-10-11 轮换，旧无密码钥已归档本地）
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd src-tauri/target/release/bundle/macos
          tar -czf "$GITHUB_WORKSPACE/LiveSub-Player.app.tar.gz" LiveSub-Player.app
          cd "$GITHUB_WORKSPACE"
          npm run tauri -- signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" \
            --app-version "${GITHUB_REF_NAME#v}" "LiveSub-Player.app.tar.gz"
          ls -l LiveSub-Player.app.tar.gz*

      - name: 上传产物（macOS）
        uses: actions/upload-artifact@v4
        with:
          name: livesub-macos
          path: |
            LiveSub-Player-macOS.zip
            LiveSub-Player.dmg
            LiveSub-Player.app.tar.gz
            LiveSub-Player.app.tar.gz.sig
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      # Release 描述 = annotated tag 的注释（发版时直接写好 1/2/3，不用自动 changelog）
      # 注意：actions/checkout 会把触发用的附注 tag 物化成「指向 commit 的轻量 tag」，
      # 直接 %(contents) 读到的是 commit message——先从 origin 强制重取附注 tag 对象
      - name: 读取版本说明（tag 注释）
        run: |
          git fetch origin --force "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md

      # sha256 清单：install.sh 下载后校验，防下载损坏/篡改
      - name: 生成 SHA256 校验文件
        working-directory: artifacts
        run: |
          sha256sum LiveSub-Player-macOS.zip LiveSub-Player.dmg LiveSub-Player.app.tar.gz \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 生成 latest.json（自动更新清单）
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import datetime, json, os
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          version = tag[1:] if tag.startswith("v") else tag
          base = f"https://github.com/{repo}/releases/download/{tag}"
          # 更新弹窗 notes 取版本说明第一行非空文本
          notes = next((l.strip() for l in open("release-notes.md") if l.strip()), f"LiveSub-Player {tag}")
          # 签名文件是 minisign 多行文本，必须原样读入再 json 序列化（不能 shell 拼接）
          mac_sig = open("artifacts/LiveSub-Player.app.tar.gz.sig").read().strip()
          data = {
              "version": version,
              "notes": notes,
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "darwin-aarch64": {"signature": mac_sig, "url": f"{base}/LiveSub-Player.app.tar.gz"},
              },
          }
          json.dump(data, open("latest.json", "w"), indent=2)
          print(open("latest.json").read())
          PY

      # 必须 prerelease: false：releases/latest 不含 prerelease，否则 updater 端点解析不到
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          body_path: release-notes.md
          files: |
            artifacts/*.zip
            artifacts/*.dmg
            artifacts/*.tar.gz
            artifacts/*.sig
            artifacts/SHA256SUMS.txt
            latest.json

      # 历史版本没有保留价值：仅保留最近 3 个 Release（含本次），
      # 更早的连 Release 带 tag 一起删，避免 Release 页和 tag 列表堆积
      - name: 清理旧 Release（仅保留最近 3 个）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[3:][] | [.id, .tag_name] | @tsv' \
            | while IFS=$'\t' read -r id tag; do
                echo "删除旧 Release: $tag (id=$id)"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id" || true
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/$tag" || true
              done
