<!doctype html>
<meta charset="utf-8" />
<!--
  DMG 安装引导背景图的源稿。修改文案/布局后重新渲染：

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
    --headless --disable-gpu --hide-scrollbars \
    --screenshot=packaging/dmg/dmg-bg.png \
    --window-size=1320,840 packaging/dmg/dmg-bg.html

  然后补 144 DPI 元数据（Finder 按 2x 缩放的关键，没有它背景会按 1px=1pt 原尺寸绘制）：
  sips -s dpiHeight 144 -s dpiWidth 144 packaging/dmg/dmg-bg.png

  画布 1320×840 = 安装窗口 660×420 的 2x。图标槽位中心（逻辑坐标，从窗口底部算 Y）：
  左 App (170, 208) ｜右 Applications (490, 208)，见 make-dmg.sh。
-->

  body {
    width: 1320px; height: 840px; overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background:
      radial-gradient(920px 640px at 86% -12%, rgba(242, 181, 68, 0.10), transparent 60%),
      radial-gradient(1100px 780px at 6% 110%, rgba(242, 181, 68, 0.07), transparent 55%),
      linear-gradient(168deg, #ffffff 0%, #f7f6f3 58%, #efeeea 100%);
    position: relative;
    -webkit-font-smoothing: antialiased;
  }
  .title {
    position: absolute; top: 148px; left: 0; right: 0; text-align: center;
    font-size: 68px; font-weight: 800; color: #1c1913; letter-spacing: 2px;
  }
  .arrow { position: absolute; top: 426px; left: 660px; transform: translate(-50%, -50%); }
  .caption {
    position: absolute; top: 616px; left: 0; right: 0; text-align: center;
    font-size: 30px; color: #8a857b; letter-spacing: 1px;
  }
  .note {
    position: absolute; left: 72px; bottom: 52px;
    font-size: 25px; line-height: 1.75; color: #98938a; letter-spacing: 0.5px;
  }
</style>
<div class="title">拖入「应用程序」即可安装</div>
