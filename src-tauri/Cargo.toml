[package]
name = "livesub-player"
version = "1.0.0"
description = "视频没字幕？边看边自动生成。根据音频实时生成字幕的桌面播放器：本地语音识别、双语翻译、一键导出 SRT。"
edition = "2021"
default-run = "livesub-player"

[lib]
name = "livesub_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-log = "2"
whisper-rs = "0.14"
encoding_rs = "0.8"
ureq = "2"
tar = "0.4"
flate2 = "1"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSResponder", "NSWindow", "NSGraphics", "NSColor"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
